name: Daily 90s TV Memories Publisher

on:
  schedule:
    # Runs daily at 13:00 UTC (6:00 PM PKT / 1:00 PM EST)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  publish_daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Daily Article Publisher
        run: python bot/publish_daily.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "90s TV Memories Cloud Bot"
          git config --global user.email "bot@90stvmemories.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit. All queue articles already published."
          else
            git commit -m "Auto-publish daily SEO article from queue"
            git push origin main
          fi
